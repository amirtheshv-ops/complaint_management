{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTag - Register</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    
    <style>
        .split-container {
            min-height: 100vh;
        }
        .left-panel {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.95) 0%, rgba(5, 150, 105, 0.95) 100%), 
                        url('https://images.unsplash.com/photo-1449034446853-66c86144b0ad?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            padding: 4rem;
        }
        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
        }
        @media (max-width: 991.98px) {
            .left-panel {
                padding: 2rem;
                min-height: 35vh;
            }
            .right-panel {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

<div class="d-flex align-items-center justify-content-center min-vh-100 px-3 py-5">
    <div class="w-100" style="max-width: 500px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-3 mb-3 bg-emerald-soft border border-emerald-soft">
                <i class="bi bi-geo-alt-fill text-emerald fs-3"></i>
                <span class="fw-bold fs-3 text-white" style="font-family: var(--font-headings); letter-spacing: -0.5px;">GeoTag</span>
            </div>
            <h2 class="fw-bold text-white mb-1">Create Citizen Account</h2>
            <p class="text-secondary">Fill in the details below to complete your registration</p>
        </div>

                {% if error %}
                    <div class="alert alert-danger border-0 mb-4" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                    </div>
                {% endif %}

                <div class="glass-card p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary small fw-medium">Full Name</label>
                                <input class="form-control"
                                       name="fullname"
                                       placeholder="John Doe"
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary small fw-medium">Username</label>
                                <input class="form-control"
                                       name="username"
                                       placeholder="johndoe12"
                                       required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary small fw-medium">Email Address</label>
                                <input class="form-control"
                                       type="email"
                                       name="email"
                                       placeholder="john@example.com"
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-secondary small fw-medium">Phone Number</label>
                                <input class="form-control"
                                       name="phone"
                                       placeholder="+1 555-0199"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-medium">Residential Address</label>
                            <textarea class="form-control"
                                      name="address"
                                      rows="2"
                                      placeholder="123 Main St, City, Country"
                                      required></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-medium">Password</label>
                            <input class="form-control"
                                   type="password"
                                   name="password"
                                   placeholder="Create a strong password"
                                   required>
                        </div>
                        
                        <button type="submit" class="btn btn-success-custom w-100 mb-3 py-2">
                            Complete Registration
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <span class="text-secondary small">Already have an account? </span>
                        <a href="{% url 'login' %}" class="text-indigo small fw-bold text-decoration-none">
                            Sign In
                        </a>
                    </div>
                </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
