<!DOCTYPE html>
<html>

<head>

<title>Complaint Map</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<style>

#map{

height:600px;

}

</style>


</head>


<body>


<h2>Complaint Map</h2>


<div id="map"></div>



<script>


var map=L.map('map').setView(
[13.0827,80.2707],
12
);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);



{% for c in complaints %}


L.marker(
[
{{c.latitude}},
{{c.longitude}}
]

)

.addTo(map)

.bindPopup(

"{{c.title}}<br>{{c.status}}"

);



{% endfor %}


</script>


</body>
</html>
