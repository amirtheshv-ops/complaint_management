{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTag - Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    
    <style>
        .split-container {
            min-height: 100vh;
        }
        .left-panel {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.95) 0%, rgba(79, 70, 229, 0.95) 100%), 
                        url('https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            padding: 4rem;
        }
        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
        }
        @media (max-width: 991.98px) {
            .left-panel {
                padding: 2rem;
                min-height: 35vh;
            }
            .right-panel {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

<div class="d-flex align-items-center justify-content-center min-vh-100 px-3 py-5">
    <div class="w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-3 mb-3 bg-indigo-soft border border-indigo-soft">
                <i class="bi bi-geo-alt-fill text-indigo fs-3"></i>
                <span class="fw-bold fs-3 text-white" style="font-family: var(--font-headings); letter-spacing: -0.5px;">GeoTag</span>
            </div>
            <h2 class="fw-bold text-white mb-1" id="loginTitle">Welcome Back</h2>
            <p class="text-secondary" id="loginSubtitle">Sign in to report issues or check updates</p>
        </div>

                <!-- Display Errors if Views pass them -->
                {% if error %}
                    <div class="alert alert-danger border-0 mb-4" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                    </div>
                {% endif %}

                <!-- Base messages from Django framework -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger border-0 mb-4" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="glass-card p-4">
                    <!-- Portal Switcher Tab -->
                    <div class="d-flex justify-content-center mb-4 p-1 bg-dark bg-opacity-50 rounded-3 border border-light border-opacity-5">
                        <button type="button" id="btnCitizenPortal" class="btn btn-sm text-white w-50 py-1.5 rounded-2 fw-semibold bg-white bg-opacity-10" onclick="switchPortal('citizen')">
                            Citizen Portal
                        </button>
                        <button type="button" id="btnAdminPortal" class="btn btn-sm text-secondary w-50 py-1.5 rounded-2 fw-semibold" onclick="switchPortal('admin')">
                            Admin Portal
                        </button>
                    </div>

                    <form method="POST" action="{% url 'user_login' %}" id="loginForm">
                        {% csrf_token %}
                        <input type="hidden" name="portal" id="portalInput" value="{% if portal %}{{ portal }}{% else %}citizen{% endif %}">
                        
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-medium">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color" style="border: 1px solid var(--border-color); color: var(--text-secondary);">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input class="form-control border-start-0"
                                       name="username"
                                       placeholder="Enter your username"
                                       required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-color" style="border: 1px solid var(--border-color); color: var(--text-secondary);">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input class="form-control border-start-0"
                                       type="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       required>
                            </div>
                        </div>
                        
                        <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 mb-3 py-2">
                            Sign In
                        </button>
                    </form>
                    
                    <div class="text-center mt-3" id="registerFooter">
                        <span class="text-secondary small">Don't have an account? </span>
                        <a href="{% url 'register' %}" class="text-indigo small fw-bold text-decoration-none">
                            Register Here
                        </a>
                    </div>
                </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function switchPortal(type) {
        const citizenBtn = document.getElementById('btnCitizenPortal');
        const adminBtn = document.getElementById('btnAdminPortal');
        const title = document.getElementById('loginTitle');
        const subtitle = document.getElementById('loginSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const registerFooter = document.getElementById('registerFooter');
        const portalInput = document.getElementById('portalInput');
        
        if (portalInput) {
            portalInput.value = type;
        }
        
        if (type === 'admin') {
            citizenBtn.classList.remove('bg-white', 'bg-opacity-10', 'text-white');
            citizenBtn.classList.add('text-secondary');
            
            adminBtn.classList.add('bg-white', 'bg-opacity-10', 'text-white');
            adminBtn.classList.remove('text-secondary');
            
            title.innerText = "Admin Console Login";
            subtitle.innerText = "Sign in with your administrative credentials to manage tickets";
            submitBtn.innerText = "Enter Admin Workspace";
            
            // Apply admin color theme overrides inline (red/crimson colors)
            submitBtn.style.setProperty('background-color', '#ef4444', 'important');
            submitBtn.style.setProperty('box-shadow', '0 4px 12px rgba(239, 68, 68, 0.25)', 'important');
            
            if (registerFooter) registerFooter.style.display = 'none';
        } else {
            adminBtn.classList.remove('bg-white', 'bg-opacity-10', 'text-white');
            adminBtn.classList.add('text-secondary');
            
            citizenBtn.classList.add('bg-white', 'bg-opacity-10', 'text-white');
            citizenBtn.classList.remove('text-secondary');
            
            title.innerText = "Welcome Back";
            subtitle.innerText = "Sign in to report issues or check updates";
            submitBtn.innerText = "Sign In";
            
            // Revert back to variables
            submitBtn.style.removeProperty('background-color');
            submitBtn.style.removeProperty('box-shadow');
            
            if (registerFooter) registerFooter.style.display = 'block';
        }
    }
    
    // Auto toggle to Admin tab if validation redirected back from admin portal
    {% if portal == 'admin' %}
    document.addEventListener("DOMContentLoaded", function() {
        switchPortal('admin');
    });
    {% endif %}
</script>
</body>
</html>
