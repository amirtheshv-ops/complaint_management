<!DOCTYPE html>
<html>

<head>

<title>My Complaints</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>
My Complaints
</h2>



<table class="table table-bordered">


<tr>

<th>ID</th>
<th>Category</th>
<th>Title</th>
<th>Status</th>

</tr>


{% for c in complaints %}


<tr>

<td>{{c.id}}</td>

<td>{{c.category}}</td>

<td>{{c.title}}</td>

<td>{{c.status}}</td>


</tr>


{% endfor %}


</table>


</div>


</body>
</html>
